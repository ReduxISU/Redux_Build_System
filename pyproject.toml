[project]
name = "redux-build"
version = "0.1.0"
description = "Centralized CI/CD build-automation CLI (rbs) for the ISU Redux repos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "requests>=2.32",
]

[project.scripts]
rbs = "redux_build.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pip-audit",
    "black",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "redux_build"

[tool.black]
target-version = ["py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["redux_build"]
