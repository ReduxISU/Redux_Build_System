# Reusable CI for every Redux repo. Callers contain no pipeline logic:
#
#   permissions:            # a reusable workflow can only NARROW the token, never widen it,
#     contents: read        # so the caller must grant these or the report comment 403s
#     pull-requests: write
#     packages: write
#   jobs:
#     ci:
#       uses: ReduxISU/Redux_Build_System/.github/workflows/ci.yml@main
#       secrets: inherit
#
# The gates run inside the CALLER's own devcontainer, so the toolchain (.NET / Node / Python)
# is declared once in that repo's devcontainer.json and used by humans and CI alike — rbs never
# has to know how to install it. rbs arrives there as the `ghcr.io/reduxisu/features/rbs` feature.
#
# `rbs ci` is the whole pipeline: every quality gate runs even after a failure, the artifact
# chain blocks on its prerequisites, and the report renders last. No policy lives in this file.
name: rbs ci

on:
  workflow_call:
    inputs:
      variant:
        description: "Matrix label recorded on each fragment (e.g. py3.12)."
        type: string
        default: ""
      soft:
        description: "Report without failing the job — for trialling rbs alongside existing CI."
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky report comment
      packages: write # `rbs push`, once implemented

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run rbs in the repo's devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: rbs ci --post ${{ inputs.soft && '--soft' || '' }} ${{ inputs.variant && format('--variant {0}', inputs.variant) || '' }}
          # GITHUB_EVENT_PATH and GITHUB_STEP_SUMMARY are runner temp paths that are not mounted
          # into the container, so the PR number is passed explicitly and the summary is appended
          # on the runner below from report.md (which lands in the bind-mounted workspace).
          env: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_ACTIONS=true
            RBS_PR_NUMBER=${{ github.event.pull_request.number }}

      - name: Publish report to the job summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report.md produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbs-report${{ inputs.variant && format('-{0}', inputs.variant) || '' }}
          path: |
            .rbs/report/*.json
            report.md
          if-no-files-found: warn
